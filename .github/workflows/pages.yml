name: Pages

# Publishes the production build to the gh-pages branch, which GitHub Pages serves at
# https://najibjuraimi-glitch.github.io/piecebook/ once Settings → Pages → Source is
# "Deploy from a branch" (gh-pages, / root). The app is built with base /piecebook/;
# public/404.html bounces deep links such as /piecebook/pregrade to /piecebook/?/pregrade
# (HTTP 200), then index.html restores the pretty path. Do not overwrite 404.html with index.html.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build for /piecebook/
        run: npm run build
        env:
          PIECEBOOK_BASE: /piecebook/
          # The old site has no /api proxy, so it calls the Worker directly. Once the
          # Worker is behind Access this stops working on purpose; the site is retired.
          VITE_API_BASE: https://piecebook-vision.najibjuraimi.workers.dev
          # No cloud sync on the old origin: it has no Access session to sync with.
          VITE_SYNC: "off"
          # Flip to the new home (e.g. https://piecebook.pages.dev) to show the "we moved"
          # banner with the Download-my-data button. Empty = no banner.
          VITE_MOVED_TO: ${{ vars.PIECEBOOK_MOVED_TO || '' }}

      - name: SPA fallback and no Jekyll
        run: |
          test -f dist/404.html
          touch dist/.nojekyll

      - name: Check out gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Commit the build to gh-pages
        run: |
          rsync -a --delete --exclude .git dist/ gh-pages/
          cd gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo "Site unchanged."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Deploy ${GITHUB_SHA::7} to GitHub Pages"
          git push
