name = "piecebook-vision"
main = "src/index.js"
compatibility_date = "2026-10-01"
account_id = "dd046e58e703dcb6cc96aa78d2fc13e5"

# Deploy: `npm run worker:deploy` from the repo root (wrangler is a root devDependency; every
# `worker:*` script passes --config worker/wrangler.toml). Secret: `npm run worker:secret`.
#
# This file IS the live configuration: Access lock + cloud sync are on, so a
# redeploy from a clean checkout can never reopen the Worker. With
# ACCESS_TEAM_DOMAIN + ACCESS_AUD set, every route but /health refuses requests
# without a valid Cloudflare Access JWT. docs/CLOUDFLARE-SETUP.md explains each value.

[vars]
GEMINI_MODEL = "gemini-3.8-flash"
DAILY_CAP = "60"
# Browser origins allowed to call the Worker directly (comma-separated; `https://*.host` = one subdomain level).
# The Pages site calls through its own /api proxy, so it only needs listing for the Origin check.
ALLOWED_ORIGINS = "https://najibjuraimi-glitch.github.io,https://piecebook.pages.dev,https://*.piecebook.pages.dev"
# --- Cloudflare Access (step 5 in docs/CLOUDFLARE-SETUP.md) ---
ACCESS_TEAM_DOMAIN = "https://piecebook.cloudflareaccess.com"
# Comma-separated aud tags; add a second one if the Worker gets its own Access app.
ACCESS_AUD = "413881efdd7d08215540d0aa34ee8dae0cdc169deb17ce0e12fe0e66424febea"
OWNER_EMAIL = "najibjuraimi@gmail.com"      # identity a service token reads as
SERVICE_TOKEN_WRITE = "0"                   # "1" to let agents write

[[kv_namespaces]]
binding = "VISION_CAP"
id = "c6e044e2b36843648c53ff84663a81a4"

# --- Cloud sync store (step 4 in docs/CLOUDFLARE-SETUP.md) ---
[[kv_namespaces]]
binding = "USER_DATA"
id = "fbb335c717da4e0e98ffd433cb702ca2"

# --- Local dev: `npm run worker:dev` from the repo root (KV simulated on disk) ---
# worker/.dev.vars (git-ignored) holds ACCESS_DEV_IDENTITY=<email> so /sync works
# on localhost without Access, plus GEMINI_API_KEY for /check. Vite proxies /api here.
[env.dev]
vars = { GEMINI_MODEL = "gemini-3.8-flash", DAILY_CAP = "60" }
kv_namespaces = [
  { binding = "VISION_CAP", id = "local-vision-cap" },
  { binding = "USER_DATA", id = "local-user-data" },
]
